<text x="32" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="var(--ink)" text-anchor="start">“Make it undetectable” request</text>
<rect x="330" y="334" width="442.0" height="12" rx="4" fill="var(--accent)" stroke="none"/>
