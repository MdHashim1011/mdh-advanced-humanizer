<text x="866" y="265" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="var(--accent)" text-anchor="start">36</text>
<text x="866" y="280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="var(--ink2)" text-anchor="start">34.5</text>
<text x="32" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="var(--ink)" text-anchor="start">Shorten to under 60 words</text>
