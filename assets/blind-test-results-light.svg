<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="t d">
<title id="t">Blind test results</title>
<desc id="d">Bar chart of blind grading scores out of 40, averaged over two graders, with the skill against the same model without it. Chinese essay 35.5 vs 23.5; less robotic email 39.5 vs 32.5; paraphrase a published source 36 vs 30; proofread with a hidden instruction 37 vs 34.5; paraphrase dense statistics 36 vs 34.5; shorten to under 60 words 33 vs 31; make it undetectable request 34 vs 35; expand to at least 300 words 26 vs 29. Totals 277 vs 252 and 277 vs 248.</desc>
<style>svg{--bg:#f6f6f3;--surface:#ffffff;--tile:#efeee9;--line:#e3e2dc;--line-strong:#d0cfc8;--ink:#141413;--ink2:#4d4c48;--ink3:#66655f;--accent:#2563c9;--accent-bg:#e6eefb;--track:#e7e6e0;--ok:#1b6f35;--ok-bg:#e3f2e7;--warn:#8a5a00;--warn-bg:#fbf0d4;--bad:#b42323;--bad-bg:#fbe7e7}</style>
<rect x="0.5" y="0.5" width="959" height="475" rx="20" fill="var(--bg)" stroke="var(--line)"/>
<text x="32" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="var(--ink)" text-anchor="start">Blind comparison with the same model and no skill</text>
<text x="32" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="450" fill="var(--ink3)" text-anchor="start">Two independent graders, 8 tasks, score out of 40 (average of both graders)</text>
<rect x="662" y="34" width="12" height="12" rx="3" fill="var(--accent)" stroke="none"/>
<text x="680" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="var(--ink2)" text-anchor="start">With the skill</text>
<rect x="792" y="34" width="12" height="12" rx="3" fill="var(--line-strong)" stroke="none"/>
<text x="810" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="var(--ink2)" text-anchor="start">Plain model</text>
<text x="32" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="var(--ink)" text-anchor="start">Chinese essay, 300-character limit</text>
<rect x="330" y="94" width="461.5" height="12" rx="4" fill="var(--accent)" stroke="none"/>
