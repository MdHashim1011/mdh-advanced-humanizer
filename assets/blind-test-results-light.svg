<text x="866" y="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="var(--ink)" text-anchor="start">29</text>
<text x="32" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="var(--ink2)" text-anchor="start">Totals: 277 vs 252 (grader 1) and 277 vs 248 (grader 2). Skill wins 6 and 5 tasks, plain model 2 and 2.</text>
