<text x="866" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="var(--ink2)" text-anchor="start">23.5</text>
<text x="32" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="var(--ink)" text-anchor="start">Make an email less robotic</text>
