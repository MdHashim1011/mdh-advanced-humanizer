<text x="866" y="360" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="650" fill="var(--ink)" text-anchor="start">35</text>
<text x="32" y="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="var(--ink)" text-anchor="start">Expand to at least 300 words</text>
<rect x="330" y="374" width="338.0" height="12" rx="4" fill="var(--accent)" stroke="none"/>
<rect x="330" y="389" width="377.0" height="12" rx="4" fill="var(--line-strong)" stroke="none"/>
